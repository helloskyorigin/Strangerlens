name: StrangerLens UI build verification

on:
  push:
    branches: [main]
    paths:
      - "components/landing/**"
      - "components/legal-shell.css"
      - "components/LegalLayout.tsx"
      - "components/BrandMark.tsx"
      - "components/ScanScreen.tsx"
      - "components/scan-screen-v2.css"
      - "__tests__/scan-v2-ux.test.tsx"
      - "__tests__/analysis-desk-ui.test.tsx"
      - "app/**"
      - ".github/workflows/landing-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strangerlens-ui-build-main
  cancel-in-progress: true

jobs:
  ui-build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: TypeScript
        run: npm run typecheck
      - name: Scan screen behavior checks
        run: |
          node --import tsx __tests__/scan-v2-ux.test.tsx
          node --import tsx __tests__/analysis-desk-ui.test.tsx
      - name: Production build
        run: npm run build
