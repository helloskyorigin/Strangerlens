name: StrangerLens payment integrity

on:
  push:
    branches: [main]
    paths:
      - "server/security/**"
      - "server/payments/**"
      - "server/storage/**"
      - "app/api/report/**"
      - "app/api/payments/**"
      - "__tests__/dodo-checkout.test.ts"
      - "__tests__/payment-return-dom.tsx"
      - ".github/workflows/payment-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strangerlens-payment-integrity-main
  cancel-in-progress: true

jobs:
  verify-payment:
    name: Verify Dodo checkout and report entitlement
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Checkout, unpaid denial and verified-payment integration
        run: npm run test:payments
