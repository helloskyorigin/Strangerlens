name: StrangerLens quality checks

on:
  push:
    branches: [main]
    paths:
      - "components/**"
      - "lib/**"
      - "app/**"
      - "services/**"
      - "server/**"
      - "hooks/**"
      - "types/**"
      - "__tests__/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/quality.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: TypeScript
        run: npm run typecheck
      - name: Regression suite
        run: npm test
      - name: Purchase readiness regressions
        run: npm run test:purchase-readiness
      - name: Payment and report unlock integration (local Redis, mocked Dodo)
        run: npm run test:payments
      - name: Production build
        run: npm run build
